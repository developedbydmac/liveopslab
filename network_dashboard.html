<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LiveOpsLab Network Dashboard</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #1a1a1a;
            color: #ffffff;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #00d4ff;
            margin: 0;
            font-size: 2.5em;
            text-shadow: 0 0 10px rgba(0, 212, 255, 0.3);
        }

        .status-summary {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .status-card {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px 25px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .status-card h3 {
            margin: 0 0 10px 0;
            font-size: 1.1em;
            color: #cccccc;
        }

        .status-card .count {
            font-size: 2em;
            font-weight: bold;
            margin: 0;
        }

        .network-grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 15px;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .ap-tile {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
        }

        .ap-tile:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: #00d4ff;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 212, 255, 0.2);
        }

        .ap-id {
            font-weight: bold;
            font-size: 0.9em;
            margin-bottom: 10px;
            color: #00d4ff;
        }

        .zones {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            margin: 2px;
            position: relative;
            transition: all 0.3s ease;
            cursor: help;
        }

        .dot.healthy { 
            background-color: #28a745; 
            box-shadow: 0 0 8px rgba(40, 167, 69, 0.4);
        }
        
        .dot.warning { 
            background-color: #ffc107; 
            box-shadow: 0 0 8px rgba(255, 193, 7, 0.4);
        }
        
        .dot.down { 
            background-color: #dc3545; 
            box-shadow: 0 0 8px rgba(220, 53, 69, 0.4);
        }

        .dot:hover {
            transform: scale(1.3);
        }

        .zone-labels {
            display: flex;
            gap: 8px;
            margin-top: 8px;
            font-size: 0.7em;
            color: #999;
        }

        .zone-label {
            text-align: center;
            min-width: 16px;
        }

        .tooltip {
            position: absolute;
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.8em;
            z-index: 1000;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s ease;
            border: 1px solid #00d4ff;
            white-space: nowrap;
        }

        .tooltip.show {
            opacity: 1;
        }

        .refresh-indicator {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0, 212, 255, 0.1);
            border: 1px solid #00d4ff;
            border-radius: 50px;
            padding: 8px 15px;
            font-size: 0.8em;
            color: #00d4ff;
        }

        .refresh-indicator.updating {
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .legend {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9em;
        }

        .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .error-message {
            background: rgba(220, 53, 69, 0.1);
            border: 1px solid #dc3545;
            border-radius: 8px;
            padding: 15px;
            margin: 20px auto;
            max-width: 600px;
            text-align: center;
            color: #dc3545;
        }

        @media (max-width: 768px) {
            .network-grid {
                grid-template-columns: repeat(5, 1fr);
                gap: 10px;
            }
            
            .ap-tile {
                padding: 10px;
            }
            
            .dot {
                width: 12px;
                height: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🌐 LiveOpsLab Network Dashboard</h1>
    </div>

    <div class="status-summary">
        <div class="status-card">
            <h3>Total APs</h3>
            <p class="count" id="total-aps">50</p>
        </div>
        <div class="status-card">
            <h3>Healthy Zones</h3>
            <p class="count" style="color: #28a745;" id="healthy-zones">-</p>
        </div>
        <div class="status-card">
            <h3>Warning Zones</h3>
            <p class="count" style="color: #ffc107;" id="warning-zones">-</p>
        </div>
        <div class="status-card">
            <h3>Down Zones</h3>
            <p class="count" style="color: #dc3545;" id="down-zones">-</p>
        </div>
    </div>

    <div class="refresh-indicator" id="refresh-indicator">
        Last updated: Never
    </div>

    <div class="network-grid" id="network-grid">
        <!-- AP tiles will be generated here -->
    </div>

    <div class="legend">
        <div class="legend-item">
            <div class="legend-dot" style="background-color: #28a745;"></div>
            <span>Healthy (< 50ms)</span>
        </div>
        <div class="legend-item">
            <div class="legend-dot" style="background-color: #ffc107;"></div>
            <span>Warning (50-100ms)</span>
        </div>
        <div class="legend-item">
            <div class="legend-dot" style="background-color: #dc3545;"></div>
            <span>Down (> 100ms or offline)</span>
        </div>
    </div>

    <div class="tooltip" id="tooltip"></div>

    <script>
        class NetworkDashboard {
            constructor() {
                this.networkData = null;
                this.refreshInterval = null;
                this.tooltip = document.getElementById('tooltip');
                this.init();
            }

            init() {
                this.generateAPGrid();
                this.startAutoRefresh();
                this.loadNetworkData();
            }

            generateAPGrid() {
                const grid = document.getElementById('network-grid');
                grid.innerHTML = '';

                // Generate 50 AP tiles (AP-01 to AP-50)
                for (let i = 1; i <= 50; i++) {
                    const apId = `AP-${i.toString().padStart(2, '0')}`;
                    const tile = this.createAPTile(apId);
                    grid.appendChild(tile);
                }
            }

            createAPTile(apId) {
                const tile = document.createElement('div');
                tile.className = 'ap-tile';
                tile.innerHTML = `
                    <div class="ap-id">${apId}</div>
                    <div class="zones">
                        <div class="dot down" data-zone="FanWiFi" data-ap="${apId}"></div>
                        <div class="dot down" data-zone="VisitorWiFi" data-ap="${apId}"></div>
                        <div class="dot down" data-zone="Backstage" data-ap="${apId}"></div>
                    </div>
                    <div class="zone-labels">
                        <div class="zone-label">Fan</div>
                        <div class="zone-label">Visit</div>
                        <div class="zone-label">Back</div>
                    </div>
                `;

                // Add hover events for tooltips
                const dots = tile.querySelectorAll('.dot');
                dots.forEach(dot => {
                    dot.addEventListener('mouseenter', (e) => this.showTooltip(e));
                    dot.addEventListener('mouseleave', () => this.hideTooltip());
                    dot.addEventListener('mousemove', (e) => this.updateTooltipPosition(e));
                });

                return tile;
            }

            async loadNetworkData() {
                const refreshIndicator = document.getElementById('refresh-indicator');
                refreshIndicator.classList.add('updating');
                
                try {
                    // Try to load network topology data
                    const response = await fetch('network_topology.json');
                    if (response.ok) {
                        this.networkData = await response.json();
                        this.updateAPStatus();
                        this.updateStatusSummary();
                        refreshIndicator.textContent = `Last updated: ${new Date().toLocaleTimeString()}`;
                    } else {
                        throw new Error('Network topology file not found');
                    }
                } catch (error) {
                    console.warn('Network topology not found, generating mock data:', error);
                    this.generateMockData();
                    refreshIndicator.textContent = `Mock data: ${new Date().toLocaleTimeString()}`;
                }
                
                refreshIndicator.classList.remove('updating');
            }

            generateMockData() {
                // Generate realistic mock data for demonstration
                const zones = ['FanWiFi', 'VisitorWiFi', 'Backstage'];
                const access_points = [];

                for (let i = 1; i <= 50; i++) {
                    const apId = `AP-${i.toString().padStart(2, '0')}`;
                    const switchId = `Switch-${(Math.floor((i-1)/3) + 1).toString().padStart(2, '0')}`;
                    
                    const ap = {
                        ap_id: apId,
                        switch_id: switchId,
                        location: {
                            floor: Math.floor(Math.random() * 4) + 1,
                            section: ['North', 'South', 'East', 'West'][Math.floor(Math.random() * 4)]
                        },
                        hardware: {
                            model: ['Cisco AP-2700', 'Aruba AP-325', 'Ubiquiti UAP-AC-HD'][Math.floor(Math.random() * 3)],
                            uptime_hours: Math.floor(Math.random() * 8760)
                        },
                        zones: {}
                    };

                    zones.forEach(zone => {
                        // Simulate some issues for demonstration
                        const hasIssue = Math.random() < 0.15; // 15% chance of issues
                        const latency = hasIssue ? 
                            Math.floor(Math.random() * 200) + 50 : // 50-250ms if issue
                            Math.floor(Math.random() * 40) + 10;   // 10-50ms if healthy

                        ap.zones[zone] = {
                            status: hasIssue ? (Math.random() < 0.5 ? 'warning' : 'down') : 'healthy',
                            latency_ms: latency,
                            connected_clients: hasIssue ? 0 : Math.floor(Math.random() * 30),
                            throughput_mbps: hasIssue ? 0 : Math.round(Math.random() * 85.5 + 10.5),
                            last_updated: new Date().toISOString()
                        };
                    });

                    access_points.push(ap);
                }

                this.networkData = { access_points };
                this.updateAPStatus();
                this.updateStatusSummary();
            }

            updateAPStatus() {
                if (!this.networkData || !this.networkData.access_points) return;

                this.networkData.access_points.forEach(ap => {
                    const apTile = document.querySelector(`[data-ap="${ap.ap_id}"]`)?.parentElement?.parentElement;
                    if (!apTile) return;

                    Object.keys(ap.zones).forEach(zoneName => {
                        const zone = ap.zones[zoneName];
                        const dot = apTile.querySelector(`[data-zone="${zoneName}"]`);
                        if (dot) {
                            // Remove existing status classes
                            dot.classList.remove('healthy', 'warning', 'down');
                            
                            // Determine status based on latency and zone status
                            let status = zone.status;
                            if (status === 'healthy' && zone.latency_ms > 50) {
                                status = 'warning';
                            }
                            
                            dot.classList.add(status);
                            
                            // Store zone data for tooltip
                            dot.dataset.latency = zone.latency_ms;
                            dot.dataset.clients = zone.connected_clients;
                            dot.dataset.throughput = zone.throughput_mbps;
                            dot.dataset.updated = zone.last_updated;
                        }
                    });
                });
            }

            updateStatusSummary() {
                if (!this.networkData) return;

                let healthyZones = 0;
                let warningZones = 0;
                let downZones = 0;

                this.networkData.access_points.forEach(ap => {
                    Object.values(ap.zones).forEach(zone => {
                        if (zone.status === 'healthy' && zone.latency_ms <= 50) {
                            healthyZones++;
                        } else if (zone.status === 'healthy' || zone.status === 'warning') {
                            warningZones++;
                        } else {
                            downZones++;
                        }
                    });
                });

                document.getElementById('healthy-zones').textContent = healthyZones;
                document.getElementById('warning-zones').textContent = warningZones;
                document.getElementById('down-zones').textContent = downZones;
            }

            showTooltip(event) {
                const dot = event.target;
                const zone = dot.dataset.zone;
                const ap = dot.dataset.ap;
                const latency = dot.dataset.latency || 'N/A';
                const clients = dot.dataset.clients || '0';
                const throughput = dot.dataset.throughput || '0';
                const updated = dot.dataset.updated ? 
                    new Date(dot.dataset.updated).toLocaleTimeString() : 'Never';

                const status = dot.classList.contains('healthy') ? 'Healthy' :
                             dot.classList.contains('warning') ? 'Warning' : 'Down';

                this.tooltip.innerHTML = `
                    <strong>${ap} - ${zone}</strong><br>
                    Status: <span style="color: ${this.getStatusColor(status)}">${status}</span><br>
                    Latency: ${latency}ms<br>
                    Clients: ${clients}<br>
                    Throughput: ${throughput} Mbps<br>
                    Updated: ${updated}
                `;

                this.tooltip.classList.add('show');
                this.updateTooltipPosition(event);
            }

            hideTooltip() {
                this.tooltip.classList.remove('show');
            }

            updateTooltipPosition(event) {
                const tooltip = this.tooltip;
                const rect = tooltip.getBoundingClientRect();
                
                let left = event.pageX + 10;
                let top = event.pageY - 10;

                // Adjust if tooltip would go off screen
                if (left + rect.width > window.innerWidth) {
                    left = event.pageX - rect.width - 10;
                }
                if (top - rect.height < 0) {
                    top = event.pageY + 20;
                }

                tooltip.style.left = left + 'px';
                tooltip.style.top = top + 'px';
            }

            getStatusColor(status) {
                switch(status) {
                    case 'Healthy': return '#28a745';
                    case 'Warning': return '#ffc107';
                    case 'Down': return '#dc3545';
                    default: return '#ffffff';
                }
            }

            startAutoRefresh() {
                // Refresh every 30 seconds
                this.refreshInterval = setInterval(() => {
                    this.loadNetworkData();
                }, 30000);
            }

            stopAutoRefresh() {
                if (this.refreshInterval) {
                    clearInterval(this.refreshInterval);
                    this.refreshInterval = null;
                }
            }
        }

        // Initialize dashboard when page loads
        document.addEventListener('DOMContentLoaded', () => {
            new NetworkDashboard();
        });

        // Clean up on page unload
        window.addEventListener('beforeunload', () => {
            if (window.dashboard) {
                window.dashboard.stopAutoRefresh();
            }
        });
    </script>
</body>
</html>
